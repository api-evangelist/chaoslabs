aid: chaoslabs
name: Chaoslabs
description: >-
  Chaos Labs is a New York-based company building financial-intelligence and economic-security
  infrastructure for onchain markets. Its flagship product, Edge (Chaos Oracles), is a decentralized
  oracle protocol that unifies real-time price, risk, and proof-of-reserves data, delivering
  high-precision price feeds with an integrated risk engine plus automated, real-time risk-parameter
  optimization. Leading DeFi protocols including Aave, GMX, dYdX, Jupiter, Venus, Lido, Maker and
  Uniswap Foundation use Chaos Labs to help secure billions of dollars in value. Developer integration
  spans EVM, SVM, off-chain services and TradingView via docs.chaoslabs.xyz. Founded in 2021 by Omer
  Goldberg and Julian Lindinger, Chaos Labs is backed by Haun Ventures, Galaxy, PayPal Ventures,
  Coinbase Ventures, Lightspeed, Bessemer and others, and holds ISO/IEC 27001 certification. This
  profile was surfaced as a portfolio company of Lightspeed Venture Partners and enriched from Chaos
  Labs' real public developer surface.
